name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # @spec spec://modules/distribution/INFRA-004-open-source-release#ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  worker-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # @spec spec://modules/distribution/INFRA-004-open-source-release#artifacts.worker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/package-workers.mjs both
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-packages
          path: |
            release/agent-operator-worker-macos-*.tar.gz
            release/agent-operator-worker-windows-*.zip
          if-no-files-found: error
          retention-days: 3

  worker-smoke:
    needs: worker-artifacts
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # @spec spec://modules/worker/INFRA-003-release-and-recovery#acceptance
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: worker-packages
          path: release
      - if: runner.os == 'macOS'
        run: |
          mkdir -p work/os-package
          tar -xzf release/agent-operator-worker-macos-*.tar.gz -C work/os-package
          node scripts/smoke-worker-package.mjs work/os-package
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/os-package -Force | Out-Null
          Expand-Archive -Path (Get-Item release/agent-operator-worker-windows-*.zip) -DestinationPath work/os-package
          node scripts/smoke-worker-package.mjs work/os-package
