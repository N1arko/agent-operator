name: Draft release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      visibility: ${{ steps.release.outputs.visibility }}
    steps:
      # @spec spec://modules/distribution/INFRA-004-open-source-release#ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: release
        shell: bash
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "Release ref must be an annotated tag: $GITHUB_REF_NAME"
            exit 1
          fi
          if [ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" != "$(git rev-parse HEAD)" ]; then
            echo "Release tag does not resolve to the checked-out revision"
            exit 1
          fi
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "revision=$(git rev-parse HEAD)"
            echo "visibility=${{ github.event.repository.visibility }}"
          } >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/release/verify-version.mjs "${GITHUB_REF_NAME}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - name: Scan exact tag history
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --no-banner --exit-code 1

  release-files:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # @spec spec://modules/distribution/INFRA-004-open-source-release#artifacts.worker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/package-workers.mjs both
      - run: node scripts/release/package-self-hosted.mjs
      - run: pnpm licenses list --prod --json > release/production-licenses.json
      - name: macOS worker SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: work/worker-packages/macos
          format: spdx-json
          output-file: release/agent-operator-worker-macos-${{ needs.verify.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Windows worker SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: work/worker-packages/windows
          format: spdx-json
          output-file: release/agent-operator-worker-windows-${{ needs.verify.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
          retention-days: 7

  worker-smoke:
    needs: release-files
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # @spec spec://modules/worker/INFRA-003-release-and-recovery#acceptance
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-files
          path: release
      - if: runner.os == 'macOS'
        run: |
          mkdir -p work/os-package
          tar -xzf release/agent-operator-worker-macos-*.tar.gz -C work/os-package
          node scripts/smoke-worker-package.mjs work/os-package
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/os-package -Force | Out-Null
          Expand-Archive -Path (Get-Item release/agent-operator-worker-windows-*.zip) -DestinationPath work/os-package
          node scripts/smoke-worker-package.mjs work/os-package

  coordinator-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-name: ${{ steps.image.outputs.name }}
      image-digest: ${{ steps.build.outputs.digest }}
      provenance-url: ${{ steps.image-provenance.outputs.url }}
      provenance-mode: ${{ steps.image-provenance.outputs.mode }}
    steps:
      # @spec spec://modules/distribution/INFRA-004-open-source-release#artifacts.coordinator
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/self-hosted/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.verify.outputs.version }}
          build-args: |
            AOP_VERSION=${{ needs.verify.outputs.version }}
            AOP_REVISION=${{ needs.verify.outputs.revision }}
            AOP_SOURCE=https://github.com/${{ github.repository }}
            AOP_CREATED=${{ steps.image.outputs.created }}
          provenance: mode=max
          sbom: true
      - id: attest
        if: needs.verify.outputs.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Inspect multi-architecture manifest
        run: |
          mkdir -p release
          docker buildx imagetools inspect "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" --raw > release/coordinator-manifest.json
      - name: Scan coordinator image
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          -v "$HOME/.docker:/root/.docker:ro"
          aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
          image --severity HIGH,CRITICAL --exit-code 1 --format json
          --output /workspace/release/coordinator-trivy.json
          "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
      - name: Coordinator SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: release/agent-operator-coordinator-${{ needs.verify.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - id: image-provenance
        name: Save image provenance
        env:
          AOP_REPOSITORY_VISIBILITY: ${{ needs.verify.outputs.visibility }}
          AOP_ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          AOP_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          AOP_PROVENANCE_SUBJECT_NAME: ${{ steps.image.outputs.name }}
          AOP_PROVENANCE_SUBJECT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$AOP_REPOSITORY_VISIBILITY" = "public" ]; then
            cp "$AOP_ATTESTATION_BUNDLE" release/provenance-coordinator.jsonl
            echo "url=$AOP_ATTESTATION_URL" >> "$GITHUB_OUTPUT"
            echo "mode=github-attestation" >> "$GITHUB_OUTPUT"
          else
            node scripts/release/create-provisional-provenance.mjs image release/provenance-coordinator.jsonl
            echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "mode=workflow-statement" >> "$GITHUB_OUTPUT"
          fi
      - name: Save image metadata
        env:
          AOP_IMAGE_NAME: ${{ steps.image.outputs.name }}
          AOP_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          AOP_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          AOP_RELEASE_COMMIT: ${{ needs.verify.outputs.revision }}
          AOP_IMAGE_ATTESTATION_URL: ${{ steps.image-provenance.outputs.url }}
          AOP_IMAGE_PROVENANCE_MODE: ${{ steps.image-provenance.outputs.mode }}
        run: node scripts/release/create-image-metadata.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coordinator-evidence
          path: release/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: [verify, release-files, worker-smoke, coordinator-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # @spec spec://modules/distribution/INFRA-004-open-source-release#release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-files
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coordinator-evidence
          path: release
      - id: attest-files
        if: needs.verify.outputs.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/*.spdx.json
            release/production-licenses.json
      - id: files-provenance
        name: Save downloadable-files provenance
        env:
          AOP_REPOSITORY_VISIBILITY: ${{ needs.verify.outputs.visibility }}
          AOP_ATTESTATION_BUNDLE: ${{ steps.attest-files.outputs.bundle-path }}
          AOP_ATTESTATION_URL: ${{ steps.attest-files.outputs.attestation-url }}
        run: |
          if [ "$AOP_REPOSITORY_VISIBILITY" = "public" ]; then
            cp "$AOP_ATTESTATION_BUNDLE" release/provenance-files.jsonl
            echo "url=$AOP_ATTESTATION_URL" >> "$GITHUB_OUTPUT"
            echo "mode=github-attestation" >> "$GITHUB_OUTPUT"
          else
            node scripts/release/create-provisional-provenance.mjs files release/provenance-files.jsonl release
            echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "mode=workflow-statement" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release receipt
        env:
          AOP_RELEASE_TAG: ${{ github.ref_name }}
          AOP_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          AOP_RELEASE_COMMIT: ${{ needs.verify.outputs.revision }}
          AOP_FILES_ATTESTATION_URL: ${{ steps.files-provenance.outputs.url }}
          AOP_IMAGE_ATTESTATION_URL: ${{ needs.coordinator-image.outputs.provenance-url }}
          AOP_FILES_PROVENANCE_MODE: ${{ steps.files-provenance.outputs.mode }}
          AOP_IMAGE_PROVENANCE_MODE: ${{ needs.coordinator-image.outputs.provenance-mode }}
        run: node scripts/release/create-receipt.mjs
      - name: Attest receipt
        id: attest-receipt
        if: needs.verify.outputs.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/release-receipt.json
      - name: Save receipt provenance
        env:
          AOP_REPOSITORY_VISIBILITY: ${{ needs.verify.outputs.visibility }}
          AOP_ATTESTATION_BUNDLE: ${{ steps.attest-receipt.outputs.bundle-path }}
        run: |
          if [ "$AOP_REPOSITORY_VISIBILITY" = "public" ]; then
            cp "$AOP_ATTESTATION_BUNDLE" release/provenance-receipt.jsonl
          else
            node scripts/release/create-provisional-provenance.mjs receipt release/provenance-receipt.jsonl release/release-receipt.json
          fi
      - run: node scripts/release/generate-checksums.mjs release
      - name: Create draft notes
        env:
          AOP_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          AOP_RELEASE_COMMIT: ${{ needs.verify.outputs.revision }}
          AOP_REPOSITORY_VISIBILITY: ${{ needs.verify.outputs.visibility }}
        run: node scripts/release/create-release-notes.mjs
      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing overwrite."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release/* \
            --draft --prerelease --verify-tag \
            --title "Agent Operator ${GITHUB_REF_NAME}" \
            --notes-file work/release-notes.md
