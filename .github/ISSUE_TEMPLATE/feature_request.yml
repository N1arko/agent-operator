name: Feature request
description: Propose a user or operator outcome
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Who should be able to do what after this change?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workflow
      description: Describe the current limitation or manual path.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Important boundaries
      description: Include privacy, compatibility or recovery constraints.
